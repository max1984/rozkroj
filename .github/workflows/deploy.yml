name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # false (not true): matches GitHub's own recommended Pages-deploy template,
  # and App-ads' identical deploy.yml — cancelling a Pages deployment job
  # mid-flight is a known way to leave the Pages environment's deployment
  # lock stuck "in progress", blocking every subsequent deploy (including a
  # later, good push) until it's cleared manually. Letting an in-flight
  # deploy finish before the next one starts avoids that risk; GitHub still
  # queues the newer push's run rather than dropping it.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment
